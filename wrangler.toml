name = "quizbot"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
# Keep variables added in the Cloudflare dashboard when deploying (otherwise each deploy removes them).
keep_vars = true

[vars]
NVIDIA_MODEL = "z-ai/glm-5.3-flash"
# BOT_USERNAME = "your_bot"   # optional; looked up automatically otherwise

# Workers AI: used only to turn PDFs into text (free for PDFs)
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "quizbot-db"
database_id = "c457df4e-305b-4d1f-96b1-e0f146e1c81a"
migrations_dir = "migrations"

[[queues.producers]]
binding = "QUIZ_QUEUE"
queue = "quizbot-jobs"

[[queues.consumers]]
queue = "quizbot-jobs"
max_batch_size = 1        # one chunk (~20 questions) per AI call
max_batch_timeout = 1
max_concurrency = 2       # stay under NVIDIA free-tier rate limits
max_retries = 5
